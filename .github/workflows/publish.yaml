name: Homebrew Cask Release

on:
  repository_dispatch:
    types:
      - homebrew-cask-release

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CASK_NAME: ${{ github.event.client_payload.cask.name }}
      HOMEBREW_SOURCE_REPOSITORY: ${{ github.event.client_payload.cask.source_repository }}
      PACKAGE_APP_NAME: ${{ github.event.client_payload.cask.app_name }}
      PACKAGE_APP_DESCRIPTION: ${{ github.event.client_payload.cask.description }}
      PACKAGE_APP_LICENSE: ${{ github.event.client_payload.cask.license }}
      PACKAGE_RELEASE_VERSION: ${{ github.event.client_payload.release.version }}
      PACKAGE_RELEASE_URL: ${{ github.event.client_payload.release.html_url }}
      PACKAGE_RELEASE_API_URL: ${{ github.event.client_payload.release.api_url }}
      SOURCE_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          cache_key: "mise-{{platform}}-{{version}}-{{file_hash}}"
          version: "2026.3.10"
      - name: Ingest stable release and update Homebrew cask
        run: mise run repo:brew:publish-release
      - name: Commit cask update
        shell: bash
        run: |
          git add "Casks/${CASK_NAME}.rb"
          if git diff --quiet -- "Casks/${CASK_NAME}.rb"; then
            echo "No cask changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/${CASK_NAME}.rb"
          git commit -m "Update Homebrew cask for ${CASK_NAME} ${PACKAGE_RELEASE_VERSION}"
          git push
